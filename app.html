<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TrypCar App | Demo</title>
  <meta name="theme-color" content="#030814">
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrypCar">
  <style>
    html, body { margin: 0; height: 100%; background: #030814; }
    body { display: flex; align-items: center; justify-content: center; }
    img { width: 190px; max-width: 60%; }
  </style>
</head>
<body>
  <img src="trypcar-logo.png" alt="TrypCar">
  <script>
  (function () {
    // Sends visitors to the 3D app, or to the classic app on phones that can't run 3D
    var extra = location.search + location.hash;
    var cameFrom3D = /app3d\.html/.test(document.referrer || "");
    var canRun3D = false;
    try { var c = document.createElement("canvas"); canRun3D = !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); } catch (e) {}
    location.replace((canRun3D && !cameFrom3D ? "app3d.html" : "app-classic.html") + extra);
  })();
  </script>
  <noscript><a href="app-classic.html">Open the TrypCar demo</a></noscript>
</body>
</html>
