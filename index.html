<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Mobility</title>
  <style>
    /* Reset and Core System Settings */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: #030712;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Premium Glassmorphism Navbar Layout */
    nav.navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Graduation Cap Icon Wrapper */
    .brand-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .brand-icon-wrapper svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    
    .navbar-brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .navbar-logo {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: #ffffff;
    }
    .navbar-logo span {
      color: #3b82f6;
    }
    
    .navbar-links {
      display: flex;
      gap: 1.25rem;
    }
    .navbar-links a {
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .navbar-links a:hover {
      color: #ffffff;
    }

    /* Hero Layout Section with Image Backdrop Background */
    .hero-viewport {
      position: relative;
      width: 100%;
      height: 80vh;
      overflow: hidden;
      background-image: linear-gradient(rgba(3, 7, 18, 0.2), rgba(3, 7, 18, 0.9)), url('./extended-1920x1080.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Layout Typography Centered Overlay Grid */
    .hero-content-overlay {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1.5rem;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Exact 9:36 AM Stacked Centered Text Rules */
    .main-hero-title {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .main-hero-title span {
      color: #3b82f6;
    }

    .main-hero-tagline {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1d4ed8;
      margin-bottom: 2rem;
    }

    /* The Blazing Blue-to-Purple Gradient Accent Button Layout */
    .explore-brand-btn {
      background: linear-gradient(90deg, #0070f3 0%, #7928ca 100%);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 1.1rem 3.5rem;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(121, 40, 202, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
      width: 100%;
      max-width: 340px;
    }
    .explore-brand-btn:active {
      transform: scale(0.98);
    }

    /* Lower Section Structural Layout Header Block */
    .mission-container {
      background-color: #030712;
      padding: 4rem 2rem;
      text-align: center;
    }

    .mission-title {
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .mission-title span {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Top Glass Menu Container Layer -->
  <nav class="navbar">
    <div class="navbar-brand-group">
      <!-- Graduation cap icon node layout -->
      <div class="brand-icon-wrapper">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.18 13.04l6.82 3.72 6.82-3.72V17l-6.82 3.72-6.82-3.72v-3.96z"/>
        </svg>
      </div>
      <div class="navbar-logo">TRYP<span>CAR</span></div>
    </div>
    <div class="navbar-links">
      <a href="#">About</a>
      <a href="#">Tiers</a>
    </div>
  </nav>

  <!-- Hero Full Screen Media Frame -->
  <header class="hero-viewport">
    <div class="hero-content-overlay">
      <h1 class="main-hero-title">TRYP<span>CAR</span></h1>
      <div class="main-hero-tagline">Smart Rides. Trusted Safety.</div>
      <button class="explore-brand-btn">Explore Brand</button>
    </div>
  </header>

  <!-- Lower Brand Section Container Layout -->
  <section class="mission-container">
    <h2 class="mission-title">OUR <span>MISSION</span></h2>
  </section>

</body>
</html>
