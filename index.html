<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-fallback: #060E1A; /* EMERGENCY SHIELD: Guarantees site visibility if image server delays */
            --card-blue: rgba(14, 23, 38, 0.9);
            --brand-cyan: #00A3FF;
            --brand-purple: #7000FF;
            --brand-gradient: linear-gradient(135deg, var(--brand-cyan) 0%, var(--brand-purple) 100%);
            --text-white: #FFFFFF;
            --text-muted: #CBD5E1;
            --border-glow: rgba(0, 163, 255, 0.25);
            --security-red: #EF4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-fallback);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* LIVE IMMERSIVE IMAGE BACKDROP INJECTION WITH SOLID VISIBILITY PROTECTION */
        .site-bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-fallback);
            background-image: url('extended-1920x1080.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        .site-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.5) 0%, #030712 90%);
            z-index: -1;
        }

        /* PREMIUM DYNAMIC GLASS NAVIGATION HEADER */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: #060e1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            z-index: 1000;
        }
        .brand-wrapper { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .logo-svg {
            width: 40px; height: 40px;
            background: var(--brand-gradient);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 163, 255, 0.4);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-white);
            text-transform: uppercase;
        }
        .logo-text span { color: var(--brand-cyan); }
        
        nav { display: flex; gap: 24px; align-items: center; }
        nav a {
            color: #E2E8F0; text-decoration: none;
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        nav a:hover, nav a.active { color: var(--brand-cyan); text-shadow: 0 0 8px rgba(0, 163, 255, 0.6); }

        /* MULTI-PAGE VIEW HUB CONTROLLER CONTAINER */
        .page-view {
            display: none; 
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 140px 24px 80px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-view.active-view { display: flex; animation: viewFade 0.4s ease-in-out forwards; }
        
        @keyframes viewFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* PAGE 1: HOME PLATFORM LAYOUT */
        .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 60px; align-items: center; width: 100%; }
        .hero-text-side { text-align: left; }
        .hero-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2.6rem, 6vw, 3.8rem); font-weight: 900; margin-bottom: 14px; letter-spacing: 1px; line-height: 1.1; text-transform: uppercase; text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9); }
        .hero-title span { color: var(--brand-cyan); }
        .hero-slogan { display: inline-block; font-size: clamp(0.85rem, 3.5vw, 1.05rem); font-weight: 800; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(90deg, #FFFFFF, var(--brand-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-subtitle { font-size: 1.05rem; color: #F1F5F9; margin-bottom: 45px; line-height: 1.7; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); }
        
        .login-card { background: rgba(14, 23, 38, 0.95); border: 1px solid rgba(0, 163, 255, 0.3); border-radius: 20px; padding: 45px 35px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); text-align: left; position: relative; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--brand-gradient); border-radius: 20px 20px 0 0; }
        .login-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .login-header p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brand-cyan); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(3, 7, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--text-white); font-family: 'Montserrat', sans-serif; font-size: 0.95rem; }
        .security-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 25px; }
        .security-dot { width: 8px; height: 8px; background-color: var(--security-red); border-radius: 50%; box-shadow: 0 0 8px var(--security-red); animation: pulse 2s infinite; }
        .security-text { font-size: 0.68rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
        .login-btn { width: 100%; padding: 16px; background: var(--brand-gradient); border: none; border-radius: 8px; color: var(--text-white); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3); }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* STANDARD SUBPAGE WRAPPER ARCHITECTURE */
        .subpage-container { width: 100%; max-width: 900px; margin: 0 auto; text-align: center; }
        .subpage-header { margin-bottom: 45px; }
        .subpage-header h2 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .subpage-header h2 span { color: var(--brand-cyan); }
        .panel-block { background: var(--card-blue); border: 1px solid var(--border-glow); padding: 45px; border-radius: 16px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-block p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.8; margin-bottom: 20px; }
        .panel-block h3 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; margin-top: 30px; margin-bottom: 15px; text-transform: uppercase; color: var(--text-white); border-left: 3px solid var(--brand-cyan); padding-left: 12px; }

        /* SERVICES TIERS CARDS GRID */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 100%; text-align: left; }
        .card { background-color: var(--card-blue); border: 1px solid var(--border-glow); border-radius: 16px; padding: 45px 32px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card.premium { border: 2px solid var(--brand-purple); box-shadow: 0 0 25px rgba(112, 0, 255, 0.25); }
        .card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.45rem; margin-bottom: 8px; text-transform: uppercase; }
        .card-meta { color: var(--brand-cyan); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 22px; letter-spacing: 1px; }
        .card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        .card ul { color: #E2E8F0; font-size: 0.9rem; padding-left: 18px; line-height: 2.4; list-style-type: square; }

        /* ROADMAP TIMELINE LOGISTICS */
        .timeline { max-width: 700px; margin: 0 auto; position: relative; padding-left: 24px; border-left: 2px solid var(--brand-cyan); text-align: left; }
        .timeline-item { margin-bottom: 35px; position: relative; background: var(--card-blue); padding: 25px; border-radius: 12px; border: 1px solid var(--border-glow); }
        .timeline-item::before { content: ''; position: absolute; left: -34px; top: 32px; width: 14px; height: 14px; background: var(--brand-purple); border-radius: 50%; box-shadow: 0 0 10px var(--brand-purple); border: 2px solid var(--brand-cyan); }
        .timeline-date { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--brand-cyan); font-size: 0.95rem; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
