<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrypCar | Premium Campus Mobility Network</title>
  <style>
    /* Professional Layout Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #060e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Master Fluid Frame - Shrinks everything to fit perfectly on any device screen */
    .site-container {
      width: 100%;
      max-width: 500px; /* Calibrates perfect structural width for mobile viewports */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Floating Transparent Navigation Bar Row */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1.5rem;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }
    
    .navigation-links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); /* Guarantees high text visibility over the graphic */
    }

    /* Liquid Image Engine - Guarantees zero text cropping or image truncation */
    .hero-display {
      width: 100%;
      margin-top: 3.5rem; /* Pushes graphic safely down so floating menu never blocks it */
      position: relative;
    }

    .hero-image-asset {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain; /* Forces the image to reduce and fit completely without zooming */
    }

    /* Integrated Bottom Brand Footer */
    .global-site-footer {
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      background-color: #030712;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      margin-top: auto; /* Locks footer firmly at the base of the viewport */
    }

    .footer-legal-text {
      font-size: 0.62rem;
      color: #475569; 
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="site-container">

    <!-- Transparent navigation float over image background structure -->
    <nav class="navbar">
      <div class="navigation-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="investors.html">Investors</a>
        <a href="contact.html">Contacts</a>
      </div>
    </nav>

    <!-- Liquid responsive container containing the target graphics asset -->
    <div class="hero-display">
      <img src="1792984078309.png" alt="TrypCar Display Network" class="hero-image-asset">
    </div>

    <footer class="global-site-footer">
      <div class="footer-legal-text">
        © 2026 TrypCar, Inc. All Rights Reserved. <br>Trademark & Copyright Protective Notice.
      </div>
    </footer>

  </div>

</body>
</html>
