<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Mobility</title>
  <style>
    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: #050b14;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* Target Desktop Resolution Layout Wrapper */
    .viewport-wrapper {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      position: relative;
    }

    /* Fixed Navigation Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background-color: #03070f;
    }
    
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .brand-logo-box {
      background-color: #2429f2;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-box::after {
      content: '';
      width: 16px;
      height: 12px;
      border: 2px solid #ffffff;
      border-radius: 1px;
    }
    
    .brand-text {
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
      color: #ffffff;
    }
    
    .brand-text span {
      color: #2da1f8;
    }
    
    .navigation-links {
      display: flex;
      gap: 2rem;
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-decoration: none;
    }
    
    .navigation-links a.inactive {
      color: #64748b;
    }

    /* Hero Section using your 1920x1080 Graphic Asset */
    .hero-display {
      position: relative;
      width: 100%;
      height: 1080px; /* Exact canvas height matching your graphic asset aspect */
      background-image: linear-gradient(180deg, rgba(5, 11, 20, 0.1) 0%, #050b14 95%), 
                        url('your-1920x1080-graphic-filename.png');
      background-size: cover;
      background-position: center top;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 2rem;
    }
    
    .hero-heading {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: 0.01em;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    .hero-heading span {
      color: #2da1f8;
    }

    .hero-subheading {
      color: #2429f2;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.18em;
      margin-bottom: 3rem;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    
    /* Perfect Flat Linear Gradient Interactive Button */
    .btn-explore {
      background: linear-gradient(90deg, #0076ff 0%, #7a00ff 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 1.2rem 3rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* Mission Section Grid Block */
    .mission-section {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 6rem 2rem;
      text-align: center;
    }
    
    .section-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 2rem;
    }
    
    .section-title span {
      color: #2da1f8;
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">

    <nav class="navbar">
      <div class="brand-container">
        <div class="brand-logo-box"></div>
        <div class="brand-text">TRYP<span>CAR</span></div>
      </div>
      <div class="navigation-links">
        <a href="#">ABOUT</a>
        <a href="#" class="inactive">TIERS</a>
      </div>
    </nav>

    <header class="hero-display">
      <h1 class="hero-heading">TRYP<span>CAR</span></h1>
      <p class="hero-subheading">Smart Rides. Trusted Safety.</p>
      <button class="btn-explore">Explore Brand</button>
    </header>

    <main class="mission-section">
      <h2 class="section-title">Our <span>Mission</span></h2>
    </main>

  </div>

</body>
</html>
