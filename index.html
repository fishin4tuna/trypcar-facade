<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #050B14;
            --brand-gradient: linear-gradient(135deg, #00A3FF 0%, #7000FF 100%);
            --text-white: #FFFFFF;
            --text-muted: #94A3B8;
            --border-glow: rgba(0, 163, 255, 0.2);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-navy);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Fixed Header Navbar */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(5, 11, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px; 
            z-index: 9999;
        }
        
        .brand-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        
        .logo-icon {
            width: 32px; height: 32px;
            background: var(--brand-gradient);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 163, 255, 0.4);
        }
        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem; font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .logo-text span { color: #00A3FF; }
        
        nav { 
            display: flex; 
            gap: 20px; 
        }
        
        nav a {
            color: var(--text-muted); 
            text-decoration: none;
            font-size: 0.8rem; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }
        nav a:hover, nav a.active { 
            color: #00A3FF; 
            text-shadow: 0 0 8px rgba(0, 163, 255, 0.5); 
        }
        
        /* Layout Configuration from Screenshot 3 */
        .hero-showcase {
            position: relative;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 140px 24px 80px 24px;
            /* Removed heavy dark overlay filters to ensure the vivid autumn leaves and crisp Tesla shine through */
            background-image: linear-gradient(to bottom, rgba(5, 11, 20, 0.4) 0%, rgba(5, 11, 20, 0) 40%, rgba(5, 11, 20, 0.85) 100%), 
                              url('extended-1920x1080.jpg'),
                              url('extended-1920×1080.jpg'),
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            text-align: center;
        }
        
        .hero-text-block {
            margin-top: 40px;
            background: rgba(5, 11, 20, 0.3);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.6rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }
        .hero-title span { color: #00A3FF; }
        
        .hero-slogan {
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }
        
        .hero-cta {
            display: inline-block;
            background: var(--brand-gradient); 
            color: var(--text-white);
            padding: 16px 40px; 
            font-size: 0.85rem; 
            font-weight: 800;
            border-radius: 6px; 
            text-decoration: none;
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(112, 0, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(112, 0, 255, 0.7);
        }
        
        /* Restored Complete Legal Footer */
        footer {
            background-color: #030712;
            padding: 40px 24px;
            text-align: center;
            font-size: 0.8rem;
            color: #64748B;
            border-top: 1px solid var(--border-glow);
            width: 100%;
        }
        
        @media (max-width: 680px) {
            header { padding: 14px 16px; }
            nav { gap: 14px; }
            nav a { font-size: 0.75rem; letter-spacing: 1px; }
            .hero-showcase { padding-top: 160px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-wrapper">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
                    <path d="M4 10V14C4 14 7 17 12 17C17 17 20 14 20 14V10" stroke="white" stroke-width="2"/>
                </svg>
            </div>
            <div class="logo-text">Tryp<span>Car</span></div>
        </div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="tiers.html">Tiers</a>
            <a href="investors.html">Investors</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Replicated Layout Frame from Screenshot 3 -->
        <div class="hero-showcase">
            <div class="hero-text-block">
                <h1 class="hero-title">Tryp<span>Car</span></h1>
                <div class="hero-slogan">Smart Rides. Trusted Safety.</div>
            </div>
            <div>
                <a href="about.html" class="hero-cta">Explore Brand</a>
            </div>
        </div>
    </main>

    <footer>
        © 2026 TrypCar, Inc. All rights reserved. Tryp™, TrypCar™, and TrypLuxe™ are protected trademarks.
    </footer>

</body>
</html>
