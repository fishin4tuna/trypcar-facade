<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Campus Mobility Network</title>
  <style>
    /* Professional Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      background-color: #060e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Screen Container Framework */
    .viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100vh; /* Forces the layout to fill 100% of any device screen */
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Keeps navigation at top, footer at bottom */
      
      /* Main Background Configuration - Locks graphic edge-to-edge without voids */
      background-image: linear-gradient(180deg, rgba(6, 14, 30, 0.4) 0%, rgba(6, 14, 30, 0) 40%, rgba(6, 14, 30, 0.8) 85%, #060e1e 100%), 
                        url('1792984078309.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    /* Floating Transparent Navigation Bar - Merges links inside the image */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      background: transparent; /* Removes the solid black box overlay block */
      z-index: 10;
    }
    
    .navigation-links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8); /* Ensures crisp legibility over artwork text */
    }

    /* Immersive Invisible Layout Spacer */
    .hero-content-spacer {
      flex-grow: 1;
    }

    /* Clean Integrated Minimalist Legal Footer */
    .global-site-footer {
      width: 100%;
      padding: 1.5rem 1rem;
      text-align: center;
      background: transparent;
      z-index: 10;
    }

    .footer-legal-text {
      font-size: 0.65rem;
      color: #94a3b8; 
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">

    <!-- Navbar now seamlessly floats on top inside your picture layout -->
    <nav class="navbar">
      <div class="navigation-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="investors.html">Investors</a>
        <a href="contact.html">Contacts</a>
      </div>
    </nav>

    <!-- Keeps layout content fluidly expanding on screen -->
    <div class="hero-content-spacer"></div>

    <footer class="global-site-footer">
      <div class="footer-legal-text">
        © 2026 TrypCar, Inc. All Rights Reserved. <br>Trademark & Copyright Protective Notice.
      </div>
    </footer>

  </div>

</body>
</html>
