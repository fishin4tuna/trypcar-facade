<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Mobility</title>
  <style>
    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background-color: #050b14;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background-color: #03070f;
    }
    
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    
    .brand-logo-box {
      background-color: #2429f2;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Icon details matching the white nested element shape */
    .brand-logo-box ::after {
      content: '';
      width: 14px;
      height: 10px;
      border: 2px solid #ffffff;
      border-radius: 1px;
    }
    
    .brand-text {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      color: #ffffff;
    }
    
    .brand-text span {
      color: #2da1f8;
    }
    
    .navigation-links {
      display: flex;
      gap: 1.2rem;
    }
    
    .navigation-links a {
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-decoration: none;
    }

    /* Hero Section with image background */
    .hero-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-image: linear-gradient(180deg, rgba(5, 11, 20, 0.2) 0%, #050b14 100%), 
                        url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 1.5rem;
    }
    
    .hero-heading {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 0.01em;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }
    
    .hero-heading span {
      color: #2da1f8;
    }

    .hero-subheading {
      color: #2429f2;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }
    
    /* Flat purple-to-blue gradient rectangle button */
    .btn-explore {
      background: linear-gradient(90deg, #0076ff 0%, #7a00ff 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.9rem 2.2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Content Area styling */
    .content-section {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem 1.5rem;
      text-align: center;
    }
    
    .section-title {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
    }
    
    .section-title span {
      color: #2da1f8;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand-container">
      <div class="brand-logo-box"><div></div></div>
      <div class="brand-text">TRYP<span>CAR</span></div>
    </div>
    <div class="navigation-links">
      <a href="#">ABOUT</a>
      <a href="#">TIERS</a>
    </div>
  </nav>

  <header class="hero-container">
    <h1 class="hero-heading">TRYP<span>CAR</span></h1>
    <p class="hero-subheading">Smart Rides. Trusted Safety.</p>
    <button class="btn-explore">Explore Brand</button>
  </header>

  <main class="content-section">
    <h2 class="section-title">Our <span>Mission</span></h2>
  </main>

</body>
</html>
