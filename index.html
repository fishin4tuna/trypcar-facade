<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrypCar | Premium Campus Mobility Network</title>
<style>
/* Clean Tech Reset */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background-color: #060e1e;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

/* Fixed Compact Navigation Bar Layout */
.navbar {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1.2rem 1rem;
  background-color: #030712;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
}
.navigation-links {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 420px;
  gap: 0.5rem;
}
.navigation-links a {
  color: #94a3b8; 
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-decoration: none;
  transition: color 0.2s ease;
}
.navigation-links a:hover, .navigation-links a.active {
  color: #ffffff;
}

/* Master Layout Wrapper */
.dashboard-view, .info-panel-view {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}

/* Hero Artwork Container */
.hero-container {
  width: 100%;
}
.hero-image-asset {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

/* SECTION 1: Centered Scrolling Service Rows */
.scrolling-features {
  padding: 2rem 1.25rem 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}
.centered-row-card {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 360px;
  margin: 0 auto;
}
.oversized-icon-box {
  margin-bottom: 1.25rem;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(6, 14, 30, 0) 70%);
  padding: 1rem;
  border-radius: 50%;
}
.oversized-icon-box svg {
  width: 72px;  
  height: 72px;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.row-title {
  font-size: 1.35rem;
  font-weight: 800;
  margin-bottom: 0.5rem;
  color: #ffffff;
  letter-spacing: -0.01em;
}
.row-text {
  font-size: 0.88rem;
  color: #94a3b8;
  line-height: 1.4;
}

/* Section Header Divider */
.section-divider-title {
  margin: 2.5rem auto 1rem auto;
  padding: 0 1.25rem;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #ffffff;
}

/* SECTION 2: Vibrant Colored Bubble-Grid Framework */
.bubble-grid-container {
  padding: 0 1.25rem 2rem 1.25rem;
}
.bubble-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); 
  gap: 0.75rem;
}
.bubble-card {
  border-radius: 20px;       
  padding: 1.25rem 0.5rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.05);
  cursor: pointer;
}

/* Premium Dynamic Theme Coloring for Individual Grid Items */
.bubble-blue {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}
.bubble-amber {
  background: linear-gradient(135deg, #0f172a 0%, #78350f 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}
.bubble-emerald {
  background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}
.bubble-purple {
  background: linear-gradient(135deg, #0f172a 0%, #581c87 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}
.bubble-rose {
  background: linear-gradient(135deg, #0f172a 0%, #881337 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}
.bubble-slate {
  background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
}

.bubble-icon-holder {
  margin-bottom: 0.6rem;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bubble-icon-holder svg {
  width: 38px;
  height: 38px;
  fill: none;
  stroke-width: 2.2;
}

/* Targeted White Stroke Contrast Engine */
.bubble-card svg {
  stroke: #ffffff;
}
.bubble-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.02em;
}

/* INSTANT VIEWPORT SYSTEM (NO ANIMATION / DELAY) */
.info-panel-view {
  display: none;
  padding: 2.5rem 1.5rem;
}
.back-button-container {
  margin-bottom: 2rem;
}
.back-action-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #94a3b8;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.6rem 1.2rem;
  border-radius: 30px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.back-action-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
}
.content-card-frame {
  border-radius: 24px;
  padding: 2.5rem 1.75rem;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.panel-icon-shield {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
}
.panel-icon-shield svg {
  width: 36px;
  height: 36px;
  fill: none;
  stroke: #ffffff;
  stroke-width: 2;
}
.panel-main-title {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
  color: #ffffff;
}
.panel-body-narrative {
  font-size: 0.95rem;
  color: #94a3b8;
  line-height: 1.6;
}

/* Modern Fortune 500 Legal Footer */
.global-site-footer {
  width: 100%;
  max-width: 500px;
  margin: 3rem auto 0 auto;
  padding: 2rem 1.25rem 3rem 1.25rem;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
}
.footer-legal-text {
  font-size: 0.68rem;
  color: #64748b;
  line-height: 1.6;
  letter-spacing: 0.01em;
}
.footer-legal-text strong {
  color: #94a3b8;
  font-weight: 600;
}
</style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="navigation-links">
    <a href="#" class="active" onclick="showDashboard()">Home</a>
    <a href="#">About</a>

</nav>

<!-- MAIN HOMEPAGE DASHBOARD INTERFACE -->

      </div>

    <div class="centered-row-card">

      <div class="bubble-card bubble-emerald" onclick="openServiceInfo('hubs')">

      <div class="bubble-card bubble-purple" onclick="openServiceInfo('lux')">

        <span class="bubble-label">Lux</span>
      </div>

      <div class="bubble-card bubble-rose" onclick="openServiceInfo('eco')">
        <div class="bubble-icon-holder"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>

      <div class="bubble-card bubble-slate" onclick="openServiceInfo('help')">

        <span class="bubble-label">Help</span>
      </div>
    </div>
  </section>
</div>

<!-- DETAILED INFO PANEL VIEW (INSTANT SWAP) -->
<div id="infoPanelView" class="info-panel-view">
  <div class="back-button-container">
    <button class="back-action-btn" onclick="showDashboard()">← Back to Fleet</button>
  </div>
  <div id="contentCardFrame" class="content-card-frame">
    <div id="panelIconShield" class="panel-icon-shield"></div>
    <h2 id="panelMainTitle" class="panel-main-title"></h2>
