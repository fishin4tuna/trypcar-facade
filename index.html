<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <style>
        :root {
            --bg-midnight: rgba(6, 14, 26, 0.9);
            --card-blue: rgba(14, 23, 38, 0.85);
            --brand-cyan: #00A3FF;
            --brand-purple: #7000FF;
            --brand-gradient: linear-gradient(135deg, var(--brand-cyan) 0%, var(--brand-purple) 100%);
            --text-white: #FFFFFF;
            --text-muted: #CBD5E1;
            --border-glow: rgba(0, 163, 255, 0.25);
            --security-red: #EF4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: #030712;
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* LIVE IMMERSIVE IMAGE BACKDROP INJECTION */
        .site-bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('extended-1920x1080.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        .site-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.4) 0%, rgba(3, 7, 18, 0.96) 80%);
            z-index: -1;
        }

        /* PREMIUM DYNAMIC GLASS NAVIGATION HEADER */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            z-index: 1000;
        }
        .brand-wrapper { display: flex; align-items: center; gap: 14px; }
        .logo-svg {
            width: 40px; height: 40px;
            background: var(--brand-gradient);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 163, 255, 0.4);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-white);
            text-transform: uppercase;
        }
        .logo-text span { color: var(--brand-cyan); }
        
        nav { display: flex; gap: 24px; align-items: center; }
        nav a {
            color: #E2E8F0; text-decoration: none;
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }
        nav a:hover { color: var(--brand-cyan); text-shadow: 0 0 8px rgba(0, 163, 255, 0.6); }

        /* HERO LAYER AND DUAL COLUMN ACCESS INTERFACE */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 24px 80px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
            width: 100%;
        }
        .hero-text-side { text-align: left; }
        
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.6rem, 6vw, 3.8rem);
            font-weight: 900;
            margin-bottom: 14px; letter-spacing: 1px;
            line-height: 1.1; text-transform: uppercase;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
        }
        .hero-title span { color: var(--brand-cyan); }
        
        .hero-slogan {
            display: inline-block;
            font-size: clamp(0.85rem, 3.5vw, 1.05rem);
            font-weight: 800;
            text-transform: uppercase; letter-spacing: 4px;
            background: linear-gradient(90deg, #FFFFFF, var(--brand-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-subtitle {
            font-size: 1.05rem; color: #F1F5F9;
            margin-bottom: 45px; line-height: 1.7;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }
        .hero-cta {
            display: inline-block;
            background: var(--brand-gradient); color: var(--text-white);
            padding: 18px 45px; font-size: 0.95rem; font-weight: 800;
            border-radius: 8px; text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0, 163, 255, 0.4); border: none;
            transition: all 0.3s ease;
        }
        .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 163, 255, 0.6); }

        /* HIGH-SECURITY BRANDED LOGIN INTERFACE */
        .login-card {
            background: rgba(10, 20, 38, 0.65);
            border: 1px solid rgba(0, 163, 255, 0.3);
            border-radius: 20px;
            padding: 45px 35px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.1);
            text-align: left;
            position: relative;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--brand-gradient); border-radius: 20px 20px 0 0;
        }
        .login-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px; color: var(--text-white);
        }
        .login-header p {
            font-size: 0.82rem; color: var(--text-muted); margin-bottom: 25px;
        }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label {
            display: block; font-size: 0.72rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--brand-cyan); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-white);
            font-family: 'Montserrat', sans-serif; font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none; border-color: var(--brand-cyan);
            box-shadow: 0 0 10px rgba(0, 163, 255, 0.2);
            background: rgba(3, 7, 18, 0.9);
        }
        .security-badge-row {
            display: flex; align-items: center; gap: 8px;
            margin-top: -5px; margin-bottom: 25px;
        }
        .security-dot {
            width: 8px; height: 8px; background-color: var(--security-red);
            border-radius: 50%; box-shadow: 0 0 8px var(--security-red);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; }
        }
        .security-text {
            font-size: 0.68rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px;
        }
        .login-btn {
            width: 100%; padding: 16px;
            background: var(--brand-gradient);
            border: none; border-radius: 8px;
            color: var(--text-white); font-weight: 800; font-family: 'Montserrat', sans-serif;
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3);
            transition: all 0.3s ease;
        }
        .login-btn:hover { box-shadow: 0 6px 20px rgba(0, 163, 255, 0.4); }

        .corporate-section { padding: 120px 24px; background-color: transparent; }
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem; font-weight: 900; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .section-header h2 span { color: var(--brand-cyan); }
        
        .content-block { 
            max-width: 720px; margin: 0 auto; color: var(--text-muted); 
            font-size: 1.08rem; line-height: 1.8; 
            background: var(--card-blue); border: 1px solid var(--border-glow);
            padding: 40px; border-radius: 16px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .card-container { display: flex; flex-direction: column; gap: 40px; max-width: 480px; margin: 0 auto; }
