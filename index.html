<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-midnight: rgba(6, 14, 26, 0.88);
            --card-blue: rgba(14, 23, 38, 0.85);
            --brand-cyan: #00A3FF;
            --brand-purple: #7000FF;
            --brand-gradient: linear-gradient(135deg, var(--brand-cyan) 0%, var(--brand-purple) 100%);
            --text-white: #FFFFFF;
            --text-muted: #CBD5E1;
            --border-glow: rgba(0, 163, 255, 0.25);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: #030712;
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* LIVE IMMERSIVE IMAGE BACKDROP INJECTION */
        .site-bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('extended-1920x1080.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        .site-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.45) 0%, rgba(3, 7, 18, 0.95) 85%);
            z-index: -1;
        }

        /* PREMIUM DYNAMIC GLASS NAVIGATION HEADER */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            z-index: 1000;
        }
        .brand-wrapper { display: flex; align-items: center; gap: 14px; }
        .logo-svg {
            width: 40px; height: 40px;
            background: var(--brand-gradient);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 163, 255, 0.4);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-white);
            text-transform: uppercase;
        }
        .logo-text span { color: var(--brand-cyan); }
        
        nav { display: flex; gap: 24px; align-items: center; }
        nav a {
            color: #E2E8F0; text-decoration: none;
            font-size: 0.78rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }
        nav a:hover { color: var(--brand-cyan); text-shadow: 0 0 8px rgba(0, 163, 255, 0.6); }

        /* HERO CONTENT LAYER */
        .hero-container {
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; 
            padding: 180px 24px 100px 24px;
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.8rem, 9vw, 4.2rem);
            font-weight: 900;
            margin-bottom: 14px; letter-spacing: 2px;
            line-height: 1.1; text-transform: uppercase;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
        }
        .hero-title span { color: var(--brand-cyan); }
        
        .hero-slogan {
            font-size: clamp(0.85rem, 4.5vw, 1.15rem);
            font-weight: 800;
            text-transform: uppercase; letter-spacing: 4px;
            background: linear-gradient(90deg, #FFFFFF, var(--brand-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            padding: 6px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .hero-subtitle {
            font-size: 1.1rem; color: #F1F5F9;
            max-width: 640px; margin-bottom: 55px;
            line-height: 1.7;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            background: rgba(3, 7, 18, 0.5);
            padding: 20px; border-radius: 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hero-cta {
            background: var(--brand-gradient); color: var(--text-white);
            padding: 18px 50px; font-size: 0.95rem; font-weight: 800;
            border-radius: 8px; text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0, 163, 255, 0.4); border: none;
            transition: all 0.3s ease;
        }
        .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 163, 255, 0.6); }

        /* THEMED SECTIONS WITH FROSTED GLASS TRANSLUCENCY */
        .corporate-section {
            padding: 120px 24px;
            background-color: transparent;
        }
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem; font-weight: 900; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .section-header h2 span { color: var(--brand-cyan); }
        
        .content-block { 
            max-width: 720px; margin: 0 auto; color: var(--text-muted); 
            font-size: 1.08rem; line-height: 1.8; 
            background: var(--card-blue); border: 1px solid var(--border-glow);
            padding: 40px; border-radius: 16px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .card-container { display: flex; flex-direction: column; gap: 40px; max-width: 480px; margin: 0 auto; }
        .card { 
            background-color: var(--card-blue); border: 1px solid var(--border-glow); 
            border-radius: 16px; padding: 45px 32px; 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card:hover { transform: translateY(-4px); border-color: var(--brand-cyan); }
        .card.premium { border: 2px solid var(--brand-purple); box-shadow: 0 0 25px rgba(112, 0, 255, 0.25); }
        
        .badge {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            background: var(--brand-gradient); color: var(--text-white);
            padding: 5px 22px; font-size: 0.68rem; font-weight: 800;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
        }
        .card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.45rem; margin-bottom: 8px; text-transform: uppercase; }
        .card-meta { color: var(--brand-cyan); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 22px; letter-spacing: 1px; }
        .card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        .card ul { color: #E2E8F0; font-size: 0.9rem; padding-left: 18px; line-height: 2.4; list-style-type: square; }
        
        .timeline { max-width: 640px; margin: 0 auto; position: relative; padding-left: 24px; border-left: 2px solid var(--brand-cyan); }
        .timeline-item { margin-bottom: 45px; position: relative; background: var(--card-blue); padding: 25px; border-radius: 12px; border: 1px solid var(--border-glow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .timeline-item::before {
            content: ''; position: absolute; left: -34px; top: 32px;
            width: 14px; height: 14px; background: var(--brand-purple); border-radius: 50%;
            box-shadow: 0 0 10px var(--brand-purple); border: 2px solid var(--brand-cyan);
        }
        .timeline-date { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--brand-cyan); font-size: 0.95rem; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .timeline-title { font-size: 1.25rem; font-weight: 800; color: var(--text-white); margin-bottom: 8px; }
        
        .contact-box { 
            background-color: var(--card-blue); border: 1px solid var(--border-glow); 
            border-radius: 16px; padding: 50px 32px; text-align: center; max-width: 520px; 
            margin: 0 auto; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .contact-btn { 
            display: inline-block; width: 100%; padding: 16px; 
            background: rgba(0, 163, 255, 0.08); border: 1px solid var(--brand-cyan); 
            color: var(--brand-cyan); font-weight: 800; text-transform: uppercase; 
            letter-spacing: 1.5px; border-radius: 8px; text-decoration: none; 
            margin-top: 20px; transition: all 0.3s ease; 
        }
