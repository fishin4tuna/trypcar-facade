<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Campus Mobility Network</title>
  <style>
    /* Import sharp, modern tech logo typography */
    @import url('https://googleapis.com');

    /* Clean Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #060e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Original Navigation Bar Layout */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      background-color: #030712;
    }
    
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .brand-logo-box {
      background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-box::after {
      content: '';
      width: 14px;
      height: 10px;
      border: 2px solid #ffffff;
      border-radius: 2px;
    }
    
    .brand-text {
      font-family: 'Syncopate', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      color: #ffffff;
    }
    
    .brand-text span {
      color: #3b82f6;
    }
    
    .navigation-links {
      display: flex;
      gap: 1.2rem;
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    /* Critical Mobile Layout Engine - Responsive Framework Fixes */
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        gap: 1.2rem;
        padding: 1.5rem 1rem;
        text-align: center;
      }
      
      .navigation-links {
        width: 100%;
        justify-content: space-around;
        gap: 0.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 1rem;
      }
      
      .navigation-links a {
        font-size: 0.7rem;
      }
    }

    /* Your Complete Artwork Container - Configured for Mobile Scaling */
    .hero-display {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 19; 
      max-width: 600px;
      margin: 0 auto;
      background-image: url('1792984078309.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center top;
      padding: 0 1rem;
    }

    /* Greyed-out Protective Corporate Footer Row */
    .global-site-footer {
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      background-color: #030712;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      margin-top: auto;
    }

    .footer-legal-text {
      font-size: 0.65rem;
      color: #475569; 
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand-container">
      <div class="brand-logo-box"></div>
      <div class="brand-text">TRYP<span>CAR</span></div>
    </div>
    <div class="navigation-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="investors.html">Investors</a>
      <a href="contact.html">Contacts</a>
    </div>
  </nav>

  <!-- Complete image fits beautifully below navigation bar layout -->
  <header class="hero-display"></header>

  <footer class="global-site-footer">
    <div class="footer-legal-text">
      © 2026 TrypCar, Inc. All Rights Reserved. <br>Trademark & Copyright Protective Notice.
    </div>
  </footer>

</body>
</html>
