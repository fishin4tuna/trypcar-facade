<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Campus Mobility Network</title>
  <style>
    /* Clean Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #060e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Fixed Navigation Bar Layout with clean vertical stacking for mobile */
    .navbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1rem;
      background-color: #030712;
      text-align: center;
    }
    
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    
    .brand-logo-box {
      background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-box::after {
      content: '';
      width: 12px;
      height: 8px;
      border: 2px solid #ffffff;
      border-radius: 2px;
    }
    
    .brand-text {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.03em;
      color: #ffffff;
    }
    
    .brand-text span {
      color: #3b82f6;
    }
    
    /* Spreads links out evenly across the screen with plenty of tapping room */
    .navigation-links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
    }

    /* Responsive Main Artwork Container */
    .hero-display {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 19; 
      max-width: 600px;
      margin: 0 auto;
      background-image: url('1792984078309.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center top;
    }

    /* Corporate Footer Row */
    .global-site-footer {
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      background-color: #030712;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      margin-top: auto;
    }

    .footer-legal-text {
      font-size: 0.65rem;
      color: #475569; 
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand-container">
      <div class="brand-logo-box"></div>
      <div class="brand-text">TRYP<span>CAR</span></div>
    </div>
    <div class="navigation-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="investors.html">Investors</a>
      <a href="contact.html">Contacts</a>
    </div>
  </nav>

  <!-- Main artwork image block -->
  <header class="hero-display"></header>

  <footer class="global-site-footer">
    <div class="footer-legal-text">
      © 2026 TrypCar, Inc. All Rights Reserved. <br>Trademark & Copyright Protective Notice.
    </div>
  </footer>

</body>
</html>
