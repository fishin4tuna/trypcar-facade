<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #050B14;
            --card-blue: rgba(8, 15, 28, 0.85);
            --brand-gradient: linear-gradient(135deg, #00A3FF 0%, #7000FF 100%);
            --text-white: #FFFFFF;
            --text-muted: #E2E8F0;
            --border-glow: rgba(0, 163, 255, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-navy);
            background-image: linear-gradient(rgba(5, 11, 20, 0.85), rgba(5, 11, 20, 0.95)), 
                              url('extended-1920x1080.jpg'), /* Cleaned string link path */
                              url('extended-1920\u00D71080.jpg'), /* Multi-browser fallback */
                              url('https://unsplash.com'); /* Live fail-safe premium EV asset backdrop */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-white);
            line-height: 1.6;
        }
        
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(5, 11, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glow);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 16px; z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }
        @media(min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; padding: 16px 24px; }
        }
        
        .brand-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        @media(min-width: 600px) { .brand-wrapper { margin-bottom: 0; } }
        
        .logo-svg {
            width: 28px; height: 28px;
            background: var(--brand-gradient);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 163, 255, 0.3);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-white);
            text-transform: uppercase;
        }
        .logo-text span { color: #00A3FF; }
        
        nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 400px; }
        @media(min-width: 600px) { nav { justify-content: flex-end; width: auto; } }
        
        nav a {
            color: #94A3B8; text-decoration: none;
            font-size: 0.72rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 4px 6px;
            transition: all 0.2s ease;
        }
        nav a:hover { color: #00A3FF; }
        
        .hero-container {
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 180px 24px 80px 24px; /* Enhanced mobile safety clearance */
            background: radial-gradient(circle at center, rgba(15, 28, 48, 0.1) 0%, rgba(5, 11, 20, 0.5) 100%);
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.4rem, 9vw, 3.8rem);
            font-weight: 900;
            margin-bottom: 12px; letter-spacing: 1px;
            line-height: 1.1; text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }
        .hero-title span { color: #00A3FF; }
        .hero-slogan {
            font-size: clamp(0.8rem, 4vw, 1.05rem);
            font-weight: 800;
            text-transform: uppercase; letter-spacing: 3px;
            background: linear-gradient(90deg, #00A3FF, #7000FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            padding: 0 15px;
            line-height: 1.3;
        }
        .hero-subtitle {
            font-size: 0.95rem; color: #E2E8F0;
            max-width: 620px; margin-bottom: 50px;
            line-height: 1.6;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95);
        }
        .hero-cta {
            background: var(--brand-gradient); color: var(--text-white);
            padding: 16px 45px; font-size: 0.85rem; font-weight: 800;
            border-radius: 6px; text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(112, 0, 255, 0.4); border: none;
        }
        
        .corporate-section {
            padding: 100px 24px;
            background-color: rgba(5, 11, 20, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-glow);
        }
        .corporate-section:nth-of-type(even) {
            background: rgba(8, 15, 28, 0.9);
        }
        
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; font-weight: 900; margin-bottom: 12px;
            text-transform: uppercase;
        }
        .section-header h2 span { color: #00A3FF; }
        .content-block { max-width: 700px; margin: 0 auto; color: var(--text-muted); font-size: 1rem; line-height: 1.7; }
        .content-block p { margin-bottom: 20px; }
        
        .card-container { display: flex; flex-direction: column; gap: 35px; max-width: 450px; margin: 0 auto; }
        .card { 
            background-color: var(--card-blue); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 40px 28px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        .card.premium { border: 1px solid #7000FF; }
        .card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; margin-bottom: 6px; text-transform: uppercase; }
        .card-meta { color: #00A3FF; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 20px; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .card ul { color: #E2E8F0; font-size: 0.85rem; padding-left: 18px; line-height: 2.2; }
        
        .timeline { max-width: 600px; margin: 0 auto; position: relative; padding-left: 20px; border-left: 2px solid var(--border-glow); }
        .timeline-item { margin-bottom: 40px; position: relative; }
        .timeline-item::before {
            content: ''; position: absolute; left: -27px; top: 6px;
            width: 12px; height: 12px; background: #00A3FF; border-radius: 50%;
            box-shadow: 0 0 10px #00A3FF;
        }
        .timeline-date { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #00A3FF; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
        .timeline-title { font-size: 1.15rem; font-weight: 700; color: var(--text-white); margin-bottom: 8px; }
        
        .contact-box { 
            background-color: var(--card-blue); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 40px 30px; 
            text-align: center; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        .contact-btn { display: inline-block; width: 100%; padding: 14px; background: rgba(0, 163, 255, 0.08); border: 1px solid #00A3FF; color: #00A3FF; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px; text-decoration: none; margin-top: 15px; }

        footer { background-color: rgba(3, 7, 15, 0.95); padding: 40px 24px; text-align: center; font-size: 0.8rem; color: #94A3B8; border-top: 1px solid var(--border-glow); }
        .footer-content { max-width: 700px; margin: 0 auto; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="brand-wrapper">
            <div class="logo-svg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
                    <path d="M4 10V14C4 14 7 17 12 17C17 17 20 14 20 14V10" stroke="white" stroke-width="2"/>
                    <path d="M12 11.5V21" stroke="white" stroke-width="2.5" stroke-dasharray="2 2"/>
                </svg>
            </div>
            <div class="logo-text">Tryp<span>Car</span></div>
        </div>
        <nav>
            <a href="#about">About</a>
            <a href="#services">Tiers</a>
            <a href="#investors">Investors</a>
            <a href="#events">Events</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="hero-container">
            <h1 class="hero-title">Tryp<span>Car</span></h1>
            <div class="hero-slogan">Smart Rides. Trusted Safety.</div>
