<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Premium Campus Mobility Network</title>
  <style>
    /* Clean Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #060e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Center Header Navigation */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      background-color: #030712;
    }
    
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .brand-logo-box {
      background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-box::after {
      content: '';
      width: 14px;
      height: 10px;
      border: 2px solid #ffffff;
      border-radius: 2px;
    }
    
    .brand-text {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      color: #ffffff;
    }
    
    .brand-text span {
      color: #3b82f6;
    }
    
    .navigation-links {
      display: flex;
      gap: 1.2rem;
    }
    
    .navigation-links a {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    /* Mobile Layout Engine Rules */
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        gap: 1.2rem;
        padding: 1.5rem 1rem;
        text-align: center;
      }
      
      .navigation-links {
        width: 100%;
        justify-content: space-around;
        gap: 0.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 1rem;
      }
      
      .navigation-links a {
        font-size: 0.7rem;
      }
    }

    /* Fixed Hero Layout Image Block Container */
    .hero-display {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 19; 
      max-width: 600px;
      margin: 0 auto;
      background-image: url('1792984078309.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center top;
      padding: 0 1rem;
    }

    /* Restored Safe Feature Grid Overlay System */
    .features-grid-overlay {
      position: absolute;
      bottom: 5%;
      left: 5%;
      right: 5%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .feature-card {
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 1rem;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .feature-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #3b82f6;
    }

    .feature-desc {
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1.3;
    }

    /* Corporate Site Footer Row Layout */
    .global-site-footer {
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      background-color: #030712;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      margin-top: auto;
    }

    .footer-legal-text {
      font-size: 0.65rem;
      color: #475569; 
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand-container">
      <div class="brand-logo-box"></div>
      <div class="brand-text">TRYP<span>CAR</span></div>
    </div>
    <div class="navigation-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="investors.html">Investors</a>
      <a href="contact.html">Contacts</a>
    </div>
  </nav>

  <!-- Image container hosts original interactive graphics overlays -->
  <header class="hero-display">
    <div class="features-grid-overlay">
      <div class="feature-card">
        <div class="feature-title">Safety Shield</div>
        <div class="feature-desc">Real-time dynamic live tracking protection network operations.</div>
      </div>
      <div class="feature-card">
        <div class="feature-title">Campus Hub</div>
        <div class="feature-desc">Exclusive immediate access routes to academic sectors.</div>
      </div>
    </div>
  </header>

  <footer class="global-site-footer">
    <div class="footer-legal-text">
      © 2026 TrypCar, Inc. All Rights Reserved. <br>Trademark & Copyright Protective Notice.
    </div>
  </footer>

</body>
</html>
