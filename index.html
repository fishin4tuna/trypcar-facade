<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrypCar | Smart Rides. Trusted Safety.</title>
  <style>
    /* Clean, modern mobile layout reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    body {
      background-color: #f8fafc;
      color: #0f172a;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Image wrapper designed for your campus graphic */
    .hero-container {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      background-color: #e2e8f0;
      margin-top: 1rem;
      margin-bottom: 2rem;
    }

    .hero-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Exact typography layout from the car decal */
    .brand-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
      text-align: center;
      text-transform: uppercase;
    }
    
    .brand-title .blue-text {
      color: #1d4ed8;
    }
    
    .brand-title .black-text {
      color: #0f172a;
    }

    .brand-tagline {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #475569;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Live Image Container -->
  <div class="hero-container">
    <img src="https://githubusercontent.com" alt="TrypCar Campus Asset">
  </div>

  <!-- Decal-Matched Branding -->
  <h1 class="brand-title">
    <span class="blue-text">TRYP</span><span class="black-text">CAR</span>
  </h1>
  <div class="brand-tagline">Smart Rides. Trusted Safety.</div>

</body>
</html>
