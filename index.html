<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrypCar | Premium Closed-Network Mobility</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #050B14;
            --card-blue: rgba(5, 11, 20, 0.9);
            --brand-gradient: linear-gradient(135deg, #00A3FF 0%, #7000FF 100%);
            --text-white: #FFFFFF;
            --text-muted: #E2E8F0;
            --border-glow: rgba(0, 163, 255, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-navy);
            /* Reduced dark gradients to let your image's beautiful vivid colors shine through completely */
            background-image: linear-gradient(rgba(5, 11, 20, 0.4), rgba(5, 11, 20, 0.75)), 
                              url('extended-1920x1080.jpg'),
                              url('extended-1920\u00D71080.jpg'),
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-white);
            line-height: 1.6;
        }
        
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(5, 11, 20, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glow);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14px 16px; z-index: 9999;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
        }
        @media(min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; padding: 18px 24px; }
        }
        
        .brand-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        @media(min-width: 600px) { .brand-wrapper { margin-bottom: 0; } }
        
        .logo-svg {
            width: 28px; height: 28px;
            background: var(--brand-gradient);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-white);
            text-transform: uppercase;
        }
        .logo-text span { color: #00A3FF; }
        
        nav { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
        @media(min-width: 600px) { nav { justify-content: flex-end; width: auto; gap: 20px; } }
        
        nav a {
            color: #94A3B8; text-decoration: none;
            font-size: 0.78rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 6px 4px;
            transition: all 0.2s ease;
        }
        nav a:hover { color: #00A3FF; text-shadow: 0 0 10px rgba(0, 163, 255, 0.6); }
        
        /* Adjusted section offsets so top header doesn't cover content when links are tapped */
        section { scroll-margin-top: 130px; }
        @media(min-width: 600px) { section { scroll-margin-top: 90px; } }
        
        .hero-container {
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 160px 24px 60px 24px;
            background: radial-gradient(circle at center, rgba(0, 163, 255, 0.05) 0%, rgba(5, 11, 20, 0.4) 100%);
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 9vw, 4rem);
            font-weight: 900;
            margin-bottom: 12px; letter-spacing: 1px;
            line-height: 1.1; text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }
        .hero-title span { color: #00A3FF; }
        .hero-slogan {
            font-size: clamp(0.85rem, 4vw, 1.1rem);
            font-weight: 800;
            text-transform: uppercase; letter-spacing: 3px;
            background: linear-gradient(90deg, #00A3FF, #7000FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            padding: 0 15px;
            line-height: 1.3;
        }
        .hero-subtitle {
            font-size: 0.98rem; color: #F1F5F9;
            max-width: 620px; margin-bottom: 50px;
            line-height: 1.6;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.95);
        }
        .hero-cta {
            background: var(--brand-gradient); color: var(--text-white);
            padding: 16px 45px; font-size: 0.85rem; font-weight: 800;
            border-radius: 6px; text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(112, 0, 255, 0.5); border: none;
        }
        
        .corporate-section {
            padding: 90px 24px;
            background-color: rgba(5, 11, 20, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-glow);
        }
        .corporate-section:nth-of-type(even) {
            background: rgba(8, 15, 28, 0.75);
        }
        
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem; font-weight: 900; margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .section-header h2 span { color: #00A3FF; }
        .content-block { max-width: 700px; margin: 0 auto; color: #F1F5F9; font-size: 1.02rem; line-height: 1.7; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .content-block p { margin-bottom: 20px; }
        
        .card-container { display: flex; flex-direction: column; gap: 35px; max-width: 450px; margin: 0 auto; }
        .card { 
            background-color: var(--card-blue); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            padding: 40px 28px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        .card.premium { border: 1px solid #7000FF; box-shadow: 0 20px 40px rgba(112, 0, 255, 0.15); }
        .card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.35rem; margin-bottom: 6px; text-transform: uppercase; }
        .card-meta { color: #00A3FF; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 20px; }
        .card p { color: #E2E8F0; font-size: 0.92rem; margin-bottom: 25px; }
        .card ul { color: #F1F5F9; font-size: 0.88rem; padding-left: 18px; line-height: 2.2; }
        
        .timeline { max-width: 600px; margin: 0 auto; position: relative; padding-left: 20px; border-left: 2px solid var(--border-glow); }
        .timeline-item { margin-bottom: 40px; position: relative; }
        .timeline-item::before {
            content: ''; position: absolute; left: -27px; top: 6px;
            width: 12px; height: 12px; background: #00A3FF; border-radius: 50%;
            box-shadow: 0 0 12px #00A3FF;
        }
        .timeline-date { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #00A3FF; font-size: 0.88rem; text-transform: uppercase; margin-bottom: 5px; }
        .timeline-title { font-size: 1.2rem; font-weight: 700; color: var(--text-white); margin-bottom: 8px; }
        
        .contact-box { 
            background-color: var(--card-blue); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            padding: 40px 30px; 
            text-align: center; 
            max-width: 500px; 
            margin: 0 auto; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        .contact-btn { display: inline-block; width: 100%; padding: 14px; background: rgba(0, 163, 255, 0.15); border: 1px solid #00A3FF; color: #00A3FF; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px; text-decoration: none; margin-top: 15px; }

        footer { background-color: rgba(3, 7, 15, 0.98); padding: 40px 24px; text-align: center; font-size: 0.8rem; color: #94A3B8; border-top: 1px solid var(--border-glow); }
    </style>
</head>
<body>

        <div class="brand-wrapper">
            <div class="logo-svg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
                    <path d="M4 10V14C4 14 7 17 12 17C17 17 20 14 20 14V10" stroke="white" stroke-width="2"/>
                    <path d="M12 11.5V21" stroke="white" stroke-width="2.5" stroke-dasharray="2 2"/>
                </svg>
            </div>
            <div class="logo-text">Tryp<span>Car</span></div>
        </div>
        <nav>
            <a href="#about">About</a>
            <a href="#services">Tiers</a>
            <a href="#investors">Investors</a>
            <a href="#events">Events</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="hero-container">
            <h1 class="hero-title">Tryp<span>Car</span></h1>
